name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run check:refs
      - run: npm run check:plugin
      - run: npm run check:discovery
      - run: npm run check:tiers
      - run: python3 -m py_compile skills/*/workflows/*.py
      - run: npm run test:learning-loop
